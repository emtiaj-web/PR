<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="S Moazzem Air Travels – GDS tickets, group tickets, visa processing and air ticket date change.">
<title>S Moazzem Air Travels</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0c0a14;--card:#15121f;--line:#2a2540;--fg:#f2f0fa;--mut:#9a96b3;--p1:#7a3fd1;--p2:#3f7bc4;--co:#ee6f6b;--gd:#e6c27a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 'Poppins','Hind Siliguri',sans-serif;overflow-x:hidden}
body.bn,body.bn h1,body.bn h2,body.bn h3{font-family:'Hind Siliguri','Poppins',sans-serif}
h1,h2,h3{font-family:'Playfair Display','Hind Siliguri',serif;margin:0}
.w{max-width:1120px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:30;background:rgba(12,10,20,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nv{display:flex;align-items:center;gap:14px;height:66px}
.br{font:600 17px 'Playfair Display',serif;color:var(--fg);text-decoration:none;white-space:nowrap}
.br b{color:var(--gd)}
nav{margin-left:auto;display:flex;gap:20px;align-items:center}
nav a{color:var(--mut);text-decoration:none;font-size:14px;transition:.2s}nav a:hover{color:var(--fg)}
.btn{border:0;cursor:pointer;font-weight:500;font-size:14px;font-family:inherit;padding:11px 20px;border-radius:99px;background:linear-gradient(120deg,var(--p1),var(--p2));color:#fff;text-decoration:none;display:inline-block;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(122,63,209,.4)}
.btn.c{background:linear-gradient(120deg,var(--co),#f09a5e)}
.btn.o{background:none;border:1.5px solid var(--line);color:var(--fg)}
.lg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.lg button{border:0;background:none;color:var(--mut);padding:6px 11px;cursor:pointer;font:inherit;font-size:12px}
.lg button.on{background:var(--p1);color:#fff}
#mn{display:none;margin-left:auto;background:none;border:0;color:var(--fg);font-size:26px}
.hero{padding:70px 0 50px;background:radial-gradient(600px 300px at 80% 10%,rgba(63,123,196,.25),transparent),radial-gradient(500px 300px at 10% 80%,rgba(122,63,209,.25),transparent)}
.hg{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}
.bd{display:inline-block;border:1px solid var(--gd);color:var(--gd);border-radius:99px;padding:4px 14px;font-size:12px;letter-spacing:.06em;margin-bottom:18px}
h1{font-size:clamp(30px,5vw,52px);line-height:1.2;margin-bottom:16px}
h1 em{font-style:normal;background:linear-gradient(120deg,var(--co),var(--gd));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:520px;margin:0 0 26px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.logo{background:#fff;border-radius:24px;padding:14px;box-shadow:0 20px 60px rgba(122,63,209,.35);animation:fl 6s ease-in-out infinite}
.logo img{width:100%;display:block;border-radius:14px}
@keyframes fl{50%{transform:translateY(-10px)}}
section{padding:70px 0}
.lb{color:var(--gd);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
h2{font-size:clamp(26px,4vw,38px);margin-bottom:28px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;transition:.25s;color:inherit;text-align:left;font:inherit}
.cd:hover{border-color:var(--p2);transform:translateY(-4px)}
.cd h3{font-size:19px;margin-bottom:6px}.cd p{margin:0;color:var(--mut);font-size:14px}
.ic{font-size:26px;width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--p1),var(--co));display:grid;place-items:center;margin-bottom:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.tb{display:flex;gap:8px;margin-bottom:16px}
.tb label{padding:7px 16px;border:1px solid var(--line);border-radius:99px;cursor:pointer;font-size:14px;color:var(--mut)}
.tb input{display:none}.tb label:has(input:checked){border-color:var(--co);color:var(--fg)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end}
.l{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
input[type=text],input[type=date],input[type=password],input[type=number],select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;font-size:15px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p2);outline-offset:1px}
.res{display:none;margin-top:18px;padding:18px;border-radius:14px;background:var(--bg);border:1px dashed var(--co)}
.res.s{display:block}.res pre{white-space:pre-wrap;font:inherit;margin:8px 0 14px}
.nt{font-size:13px;color:var(--mut);margin-top:10px}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.ab p{color:var(--mut);margin:0 0 14px}
.sk{margin-bottom:18px}.sk div{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.bar{display:block;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p1),var(--p2),var(--co));border-radius:9px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.in .bar i{width:var(--v)}
.rt{cursor:pointer}.rt h3{font-size:20px}.rt small{color:var(--co);font-size:13px;display:block;margin-top:10px}
.tl{position:relative;padding-left:30px;border-left:2px solid var(--line);margin-left:8px}
.tl div{position:relative;margin-bottom:28px}
.tl div:before{content:"";position:absolute;left:-39px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--co);box-shadow:0 0 0 5px var(--bg)}
.tl h3{font-size:18px}.tl p{margin:2px 0 0;color:var(--mut);font-size:14px}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.ci a{display:block;color:inherit;text-decoration:none;margin-bottom:14px}.ci b{display:block;color:var(--gd);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.ci input,.ci textarea{margin-bottom:12px}
footer{border-top:1px solid var(--line);text-align:center;padding:28px 20px;color:var(--mut);font-size:14px}
.wa{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;font-size:28px;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:25}
.md{position:fixed;inset:0;background:rgba(5,4,10,.75);display:none;place-items:center;z-index:50;padding:20px}.md.s{display:grid}
.md .box{width:100%;max-width:400px}.md input{margin-bottom:12px}
.mt{display:flex;gap:8px;margin-bottom:16px}.mt button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mut);font:inherit;cursor:pointer}.mt button.on{border-color:var(--co);color:var(--fg)}
.er{color:var(--co);font-size:13px;min-height:20px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
@media(max-width:860px){.hg,.ab,.ct{grid-template-columns:1fr}.logo{max-width:340px}#mn{display:block}nav{display:none;position:absolute;top:66px;left:0;right:0;background:var(--bg);flex-direction:column;padding:18px;border-bottom:1px solid var(--line)}nav.o{display:flex}.nv .lg{order:3}.hero{padding-top:40px}section{padding:50px 0}}
</style>
</head>
